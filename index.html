<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THERMICA - CALORUB | CicloRecreoVía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150a0c;
    --panel:#241215;
    --panel-light:#2d171b;
    --thermica:#e8542f;
    --calorub:#b3122c;
    --text:#f5e6df;
    --muted:#b08a86;
    --border:#3a1c20;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 48px;
  }
  .header{
    text-align:center;
    margin-bottom:14px;
  }
  .header h1{
    margin:0;
    font-size:clamp(22px,5vw,38px);
    font-weight:900;
    letter-spacing:0.5px;
  }
  .header h1 .thermica-word{color:var(--thermica);}
  .header h1 .sep{color:var(--muted); margin:0 10px; font-weight:700;}
  .header h1 .calorub-word{color:var(--calorub);}
  .header .subtitle{
    margin-top:4px;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .date-selector{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    padding:8px 16px;
    border-radius:12px;
    margin:18px 0 30px;
    border:1px solid var(--border);
    border-top:3px solid var(--thermica);
  }
  .date-selector label{
    font-weight:800;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
  }
  .date-selector select{
    background:var(--panel-light);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 12px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .date-selector select:focus{
    outline:2px solid var(--thermica);
  }

  .slider-section{
    width:100%;
    max-width:640px;
  }

  .slider-track{
    position:relative;
    width:100%;
    height:76px;
    background:var(--panel);
    border-radius:38px;
    border:1px solid var(--border);
    overflow:hidden;
    touch-action:none;
    cursor:grab;
  }
  .slider-fill-left, .slider-fill-right{
    position:absolute;
    top:0;
    height:100%;
    pointer-events:none;
  }
  .slider-fill-left{
    right:50%;
    background:linear-gradient(90deg, rgba(232,84,47,0.05), rgba(232,84,47,0.55));
  }
  .slider-fill-right{
    left:50%;
    background:linear-gradient(90deg, rgba(179,18,44,0.55), rgba(179,18,44,0.05));
  }
  .slider-center-mark{
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:2px;
    background:rgba(255,255,255,0.15);
    transform:translateX(-50%);
  }
  .slider-logo{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:#fff;
    border-radius:14px;
    padding:6px 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.4);
    z-index:2;
    pointer-events:none;
  }
  .slider-logo img{
    height:30px;
    width:auto;
    display:block;
  }
  .slider-logo-left{left:10px;}
  .slider-logo-right{right:10px;}

  .slider-handle{
    position:absolute;
    top:10px;
    left:50%;
    width:56px;
    height:56px;
    margin-left:-28px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:left 0.35s cubic-bezier(.2,.9,.3,1);
    z-index:3;
  }
  .slider-handle.dragging{transition:none;}
  .slider-handle::after{
    content:'';
    width:20px;
    height:20px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--thermica), var(--calorub));
  }

  .hint{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
  }

  .totals{
    display:flex;
    gap:18px;
    margin-top:34px;
    width:100%;
    max-width:640px;
  }
  .total-card{
    flex:1;
    background:var(--panel);
    border-radius:18px;
    padding:26px 14px;
    text-align:center;
    border:1px solid var(--border);
  }
  .thermica-card{border-top:4px solid var(--thermica);}
  .calorub-card{border-top:4px solid var(--calorub);}
  .total-label{
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .total-number{
    font-size:clamp(64px,16vw,96px);
    font-weight:900;
    line-height:1.1;
  }
  .thermica-card .total-number{color:var(--thermica);}
  .calorub-card .total-number{color:var(--calorub);}
  .total-percent{
    margin-top:6px;
    font-size:clamp(30px,7vw,42px);
    font-weight:800;
    color:var(--muted);
  }

  .status-msg{
    margin-top:16px;
    font-size:13px;
    font-weight:700;
    min-height:18px;
    color:var(--muted);
  }
</style>
</head>

  function setHandlePercent(p){
    currentPercent = Math.max(0, Math.min(100, p));
    handle.style.left = currentPercent + '%';
    if(currentPercent < 50){
      fillLeft.style.width = (50 - currentPercent) + '%';
      fillRight.style.width = '0%';
    } else {
      fillRight.style.width = (currentPercent - 50) + '%';
      fillLeft.style.width = '0%';
    }
  }

  function getPercentFromEvent(clientX){
    const rect = track.getBoundingClientRect();
    const rel = (clientX - rect.left) / rect.width * 100;
    return Math.max(0, Math.min(100, rel));
  }

  function startDrag(clientX){
    dragging = true;
    handle.classList.add('dragging');
  }

  function moveDrag(clientX){
    if(!dragging) return;
    setHandlePercent(getPercentFromEvent(clientX));
  }

  function endDrag(){
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');

    if(currentPercent <= REGISTER_THRESHOLD){
      registrar('THERMICA');
    } else if(currentPercent >= (100 - REGISTER_THRESHOLD)){
      registrar('CALORUB');
    }
    setHandlePercent(50);
  }

  track.addEventListener('pointerdown', (e)=>{
    track.setPointerCapture(e.pointerId);
    startDrag(e.clientX);
    setHandlePercent(getPercentFromEvent(e.clientX));
  });
  track.addEventListener('pointermove', (e)=> moveDrag(e.clientX));
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);

  function registrar(marca){
    statusMsg.textContent = 'Registrando ' + marca + '...';
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({marca: marca})
    }).then(()=>{
      statusMsg.textContent = marca + ' registrado ✓';
      setTimeout(()=>{ statusMsg.textContent=''; }, 2000);
      setTimeout(cargarDatos, 500);
    }).catch(()=>{
      statusMsg.textContent = 'Error al registrar';
    });
  }

  function actualizarTotales(fecha){
    const d = dataByFecha[fecha] || {THERMICA:0, CALORUB:0};
    const totT = d.THERMICA || 0;
    const totC = d.CALORUB || 0;
    document.getElementById('totalThermica').textContent = totT;
    document.getElementById('totalCalorub').textContent = totC;
    document.getElementById('percentThermica').textContent = '(' + Math.round(totT/META*100) + '%)';
    document.getElementById('percentCalorub').textContent = '(' + Math.round(totC/META*100) + '%)';
  }

  function cargarDatos(){
    const callbackName = 'cb_' + Date.now();
    window[callbackName] = function(result){
      dataByFecha = result.porFecha || {};
      fechas = result.fechas || [];

      const prevSelected = fechaSelect.value;
      fechaSelect.innerHTML = '';
      fechas.forEach(f=>{
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = formatFechaSimple(f);
        fechaSelect.appendChild(opt);
      });

      let seleccion = fechas.includes(prevSelected) ? prevSelected : fechas[0];
      if(seleccion){
        fechaSelect.value = seleccion;
        actualizarTotales(seleccion);
      } else {
        actualizarTotales(null);
      }

      delete window[callbackName];
      script.remove();
    };
    const script = document.createElement('script');
    script.src = ENDPOINT + '?callback=' + callbackName;
    document.body.appendChild(script);
  }

  fechaSelect.addEventListener('change', ()=>{
    actualizarTotales(fechaSelect.value);
  });

  setHandlePercent(50);
  cargarDatos();
  setInterval(cargarDatos, REFRESH_MS);
</script>
</body>
</html>
